# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: us-fda-154115.docs.buildwithfern.com
    edit-this-page:
      github:
        owner: fern-starter
        repo: family-614073
        branch: main
      launch: dashboard
title: U.S. FDA | Clinical Data Index
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
tabs:
  home:
    display-name: Home
    icon: home
  articles:
    display-name: Articles
    icon: file-lines
navigation:
  - tab: home
    layout:
      - page: Home
        path: docs/pages/welcome.mdx
        slug: welcome
  - tab: articles
    layout:
      - section: Research Articles
        contents:
          - page: All Articles
            path: docs/pages/articles.mdx
            icon: fa-duotone fa-file-lines
navbar-links:
  - type: filled
    text: Edit
    url: https://dashboard.buildwithfern.com
colors:
  accent-primary:
    light: "#007CBA"
    dark: "#007CBA"
  background:
    light: "#F7FBFD"
    dark: "#000609"
  border:
    light: "#C8D1D5"
    dark: "#252E32"
theme:
  page-actions: toolbar
  footer-nav: minimal
  tabs: bubble
logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo.svg
  height: 20
  href: https://buildwithfern.com
favicon: docs/assets/favicon.svg
css:
  - styles.css
  - docs/assets/onboarding-theme.css
js: custom.js
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
ai-search: {}
