# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: us-fda-154115.docs.buildwithfern.com
    edit-this-page:
      github:
        owner: fern-starter
        repo: family-614073
        branch: main
      launch: dashboard
title: U.S. FDA | Documentation
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
tabs:
  home:
    display-name: Home
    icon: home
  API Reference:
    display-name: API Reference
    icon: puzzle
  docs:
    display-name: Docs
    icon: book
  changelog:
    display-name: Changelog
    icon: clock
navigation:
  - tab: home
    layout:
      - page: Home
        path: docs/pages/welcome.mdx
        slug: welcome
  - tab: docs
    layout:
      - section: Get started
        contents:
          - page: Edit your docs
            path: docs/pages/editing-your-docs.mdx
            icon: fa-duotone fa-pen-to-square
          - page: Write content
            path: docs/pages/writing-content.mdx
            icon: fa-duotone fa-file-lines
          - page: Set up navigation
            path: docs/pages/navigation.mdx
            icon: fa-duotone fa-sitemap
          - page: Customize your docs
            path: docs/pages/customization.mdx
            icon: fa-duotone fa-palette
          - page: Support
            path: docs/pages/support.mdx
            icon: fa-duotone fa-headset
          - page: Pharmacological interventions for ADHD
            path: docs/pages/pharmacological-interventions-for-adhd-a-systematic-review-a.mdx
            icon: fa-duotone fa-file-lines
          - page: Treatment Outcomes With Licensed and Unlicensed Stimulant Doses
            path: docs/pages/treatment-outcomes-with-licensed-and-unlicensed-stimulant-do.mdx
            icon: fa-duotone fa-file-lines
          - page: Methylphenidate dose optimization for ADHD treatment
            path: docs/pages/methylphenidate-dose-optimization-for-adhd-treatment-review-.mdx
            icon: fa-duotone fa-file-lines
          - page: Off-label Prescribing Trends for ADHD Medications in Very Young Children
            path: docs/pages/off-label-prescribing-trends-for-adhd-medications-in-very-yo.mdx
            icon: fa-duotone fa-file-lines
          - page: A 14-Month Randomized Clinical Trial of Treatment Strategies for ADHD
            path: docs/pages/a-14-month-randomized-clinical-trial-of-treatment-strategies.mdx
            icon: fa-duotone fa-file-lines
          - page: Safety and effectiveness of methylphenidate ER multi-unit pellet system
            path: docs/pages/safety-and-effectiveness-of-methylphenidate-er-multi-unit-pe.mdx
            icon: fa-duotone fa-file-lines
          - page: Once-daily medications for the pharmacological management of ADHD
            path: docs/pages/once-daily-medications-for-the-pharmacological-management-of.mdx
            icon: fa-duotone fa-file-lines
          - page: First-Time Users of ADHD Medication Among Children and Adolescents in Germany
            path: docs/pages/first-time-users-of-adhd-medication-among-children-and-adole.mdx
            icon: fa-duotone fa-file-lines
  - tab: API Reference
    layout:
      - section: Overview
        contents:
          - page: API reference
            path: docs/pages/api-reference-overview.mdx
            icon: fa-duotone fa-book
      - api: Swagger Plant Store - OpenAPI 3.1
        flattened: false
  - tab: changelog
    layout:
      - changelog: docs/changelog
navbar-links:
  - type: filled
    text: Edit
    url: https://dashboard.buildwithfern.com
colors:
  accent-primary:
    light: "#007CBA"
    dark: "#007CBA"
  background:
    light: "#F7FBFD"
    dark: "#000609"
  border:
    light: "#C8D1D5"
    dark: "#252E32"
theme:
  page-actions: toolbar
  footer-nav: minimal
  tabs: bubble
logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo.svg
  height: 20
  href: https://buildwithfern.com
favicon: docs/assets/favicon.svg
css:
  - styles.css
  - docs/assets/onboarding-theme.css
js: custom.js
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
ai-search: {}
