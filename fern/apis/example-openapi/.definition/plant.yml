imports:
  root: __package__.yml
types:
  SearchPlantsByStatusRequestStatus:
    enum:
      - available
      - pending
      - sold
    source:
      openapi: openapi.yaml
docs: Everything about your Plants
service:
  auth: false
  base-path: ''
  display-name: plant
  endpoints:
    addPlant:
      display-name: Add a new plant to the store
      errors:
        - root.MethodNotAllowedError
      examples:
        - name: Successful Plant Addition
          request:
            category: Indoor
            name: Fern
            status: available
            tags:
              - green
              - leafy
          response:
            body:
              id: 101
              name: Fern
              status: available
              tags:
                - green
                - leafy
      method: POST
      path: /plant
      request: root.Plant
      response:
        docs: Plant successfully added
        status-code: 200
        type: root.PlantResponse
      source:
        openapi: openapi.yaml
    getPlantById:
      display-name: Find plant by ID
      docs: Retrieve a plant's details by its ID.
      examples:
        - name: Plant details
          path-parameters:
            plantId: 1
          response:
            body:
              id: 101
              name: Fern
              status: available
              tags:
                - green
                - leafy
      method: GET
      path: /plant/{plantId}
      request:
        name: GetPlantByIdRequest
        path-parameters:
          plantId:
            docs: ID of the plant to retrieve
            type: integer
      response:
        docs: Details of the requested plant
        status-code: 200
        type: root.PlantResponse
      source:
        openapi: openapi.yaml
    searchPlantsByStatus:
      display-name: Search plants by status
      docs: Filter plants based on their current status.
      examples:
        - name: Plants with status available
          response:
            body:
              - id: 101
                name: Fern
                status: available
                tags:
                  - green
                  - leafy
              - id: 102
                name: Palm
                status: available
                tags:
                  - tropical
      method: GET
      path: /plant/search/status
      request:
        name: SearchPlantsByStatusRequest
        query-parameters:
          status:
            docs: The status of plants to search for.
            type: optional<SearchPlantsByStatusRequestStatus>
      response:
        docs: List of plants matching the status filter
        status-code: 200
        type: list<root.PlantResponse>
      source:
        openapi: openapi.yaml
    searchPlantsByTags:
      display-name: Search plants by tags
      docs: Filter plants based on associated tags.
      examples:
        - name: Plants filtered by tags
          response:
            body:
              - id: 101
                name: Fern
                status: available
                tags:
                  - green
                  - leafy
              - id: 103
                name: Cactus
                status: available
                tags:
                  - spiky
                  - desert
      method: GET
      path: /plant/search/tags
      request:
        name: SearchPlantsByTagsRequest
        query-parameters:
          tags:
            allow-multiple: true
            docs: Tags to filter plants (comma-separated).
            type: optional<string>
      response:
        docs: List of plants matching the tags filter
        status-code: 200
        type: list<root.PlantResponse>
      source:
        openapi: openapi.yaml
    updatePlant:
      display-name: Update an existing plant
      errors:
        - root.BadRequestError
        - root.NotFoundError
      examples:
        - name: Successful Plant Update
          request:
            category: Indoor
            name: Fern
            status: sold
            tags:
              - green
              - leafy
          response:
            body:
              id: 101
              name: Fern
              status: sold
              tags:
                - green
                - leafy
      method: PUT
      path: /plant
      request: root.Plant
      response:
        docs: Plant successfully updated
        status-code: 200
        type: root.PlantResponse
      source:
        openapi: openapi.yaml
  source:
    openapi: openapi.yaml
