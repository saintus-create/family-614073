imports:
  root: __package__.yml
docs: Operations about user
service:
  auth: false
  base-path: ''
  display-name: user
  endpoints:
    getUserByName:
      display-name: Get user by username
      docs: Retrieve user details using their username.
      examples:
        - name: User details response
          path-parameters:
            username: username
          response:
            body:
              email: john@example.com
              id: 1
              username: john_doe
      method: GET
      path: /user/{username}
      request:
        name: GetUserByNameRequest
        path-parameters:
          username:
            docs: Username of the user to retrieve
            type: string
      response:
        docs: User details retrieved successfully
        status-code: 200
        type: root.User
      source:
        openapi: openapi.yaml
    loginUser:
      display-name: Logs user into the system
      examples:
        - name: Successful login response
          response:
            body:
              expiresIn: 3600
              token: abc123token
      method: GET
      path: /user/auth/login
      request:
        name: LoginUserRequest
        query-parameters:
          password:
            docs: The password for login
            type: optional<string>
          username:
            docs: The username for login
            type: optional<string>
      response:
        docs: Successful login
        status-code: 200
        type: root.UserAuthResponse
      source:
        openapi: openapi.yaml
    logoutUser:
      display-name: Logs out current logged-in user session
      examples:
        - {}
      method: GET
      path: /user/auth/logout
      source:
        openapi: openapi.yaml
  source:
    openapi: openapi.yaml
